name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx ruff pytest-cov
      - name: Lint
        run: ruff check . --select E,F,W,I --ignore E501
      - name: Test with coverage
        run: python -m pytest -v --tb=short --cov=app --cov-report=term-missing
